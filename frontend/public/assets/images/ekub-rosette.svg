<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Ring with Traditional Dots -->
  <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="2.5" opacity="0.9"/>
  <circle cx="50" cy="50" r="41" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  
  <!-- Interlocking Symmetrical Ethiopian Rosette Petals (8-fold symmetry) -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- North / South / East / West Petals -->
    <path d="M50 14 C42 26 42 38 50 50 C58 38 58 26 50 14 Z" fill="currentColor" fill-opacity="0.15"/>
    <path d="M50 86 C42 74 42 62 50 50 C58 62 58 74 50 86 Z" fill="currentColor" fill-opacity="0.15"/>
    <path d="M14 50 C26 42 38 42 50 50 C38 58 26 58 14 50 Z" fill="currentColor" fill-opacity="0.15"/>
    <path d="M86 50 C74 42 62 42 50 50 C62 58 74 58 86 50 Z" fill="currentColor" fill-opacity="0.15"/>
    
    <!-- Diagonal Interlocking Petals -->
    <path d="M24 24 C38 30 44 40 50 50 C40 44 30 38 24 24 Z" fill="currentColor" fill-opacity="0.12"/>
    <path d="M76 24 C62 30 56 40 50 50 C60 44 70 38 76 24 Z" fill="currentColor" fill-opacity="0.12"/>
    <path d="M24 76 C38 70 44 60 50 50 C40 56 30 62 24 76 Z" fill="currentColor" fill-opacity="0.12"/>
    <path d="M76 76 C62 70 56 60 50 50 C60 56 70 62 76 76 Z" fill="currentColor" fill-opacity="0.12"/>
    
    <!-- Inner Cross Motif -->
    <circle cx="50" cy="50" r="14" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="6" fill="currentColor"/>
    
    <!-- Accent Nodes -->
    <circle cx="50" cy="20" r="2.5" fill="currentColor"/>
    <circle cx="50" cy="80" r="2.5" fill="currentColor"/>
    <circle cx="20" cy="50" r="2.5" fill="currentColor"/>
    <circle cx="80" cy="50" r="2.5" fill="currentColor"/>
  </g>
</svg>
